name: Refresh NSW SSDA data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose the data refresh"
        required: true
        type: choice
        options:
          - full
          - recent
        default: full

  schedule:
    - cron: "0 16 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh NSW SSDA data
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python sync.py --recent
          elif [ "${{ inputs.mode }}" = "full" ]; then
            python sync.py --full
          else
            python sync.py --recent
          fi

      - name: Save updated database
        run: |
          git config user.name "WPH SSDA Tracker"
          git config user.email "actions@github.com"

          git add data/tracker.sqlite3

          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          git commit -m "Refresh NSW SSDA data"

          git pull --rebase origin main

          git push origin main
