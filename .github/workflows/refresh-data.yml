name: Refresh NSW SSDA data

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python sync.py --pages 10 --details --include-modifications

      - run: |
          git config user.name "WPH SSDA Tracker"
          git config user.email "actions@github.com"
          git add data/tracker.sqlite3
          git diff --cached --quiet || git commit -m "Refresh NSW SSDA data"
          git push
